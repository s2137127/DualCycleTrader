name: Collect Taiwan daily candles

on:
  schedule:
    # 13:15 and 14:00 Asia/Taipei (UTC+8). Run only when today's index candle exists.
    - cron: '15 5 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-taiwan-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      MARKET_API_BASE_URL: ${{ vars.MARKET_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Update Firestore daily candles
        run: python scripts/collect_daily.py
      - name: Reanalyze today's candidates
        run: dotnet run --project Automation/Automation.csproj --configuration Release
