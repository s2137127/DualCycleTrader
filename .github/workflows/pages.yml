name: Build Blazor site
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Create public web configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          MARKET_API_BASE_URL: ${{ vars.MARKET_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          data = {
              'apiKey': os.environ['FIREBASE_API_KEY'],
              'authDomain': os.environ['FIREBASE_AUTH_DOMAIN'],
              'projectId': os.environ['FIREBASE_PROJECT_ID'],
              'appId': os.environ['FIREBASE_APP_ID'],
              'marketApiBaseUrl': os.environ['MARKET_API_BASE_URL'],
          }
          with open('Web/wwwroot/firebase-config.json', 'w', encoding='utf-8') as file:
              json.dump(data, file)
          PY
      - name: Publish
        run: dotnet publish Web/Web.csproj -c Release -o publish/web
      - name: Set GitHub Pages base path
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          owner, repo = os.environ['REPOSITORY'].split('/')
          base = '/' if repo.lower() == f'{owner.lower()}.github.io' else f'/{repo}/'
          page = Path('publish/web/wwwroot/index.html')
          page.write_text(page.read_text().replace('<base href="/" />', f'<base href="{base}" />'))
          PY
          touch publish/web/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
